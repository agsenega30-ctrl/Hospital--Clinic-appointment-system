{% extends "base.html" %}

{% block title %}{{ title }} - {{ app_name }}{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="card" style="max-width: 500px; width: 100%; text-align: center; padding: 2.5rem 1.5rem;">
    <div style="font-size: 3.5rem; color: var(--primary-600); margin-bottom: 1rem;">
      {% if code == 403 %}
        <i class="fa-solid fa-lock"></i>
      {% elif code == 429 %}
        <i class="fa-solid fa-hourglass-half"></i>
      {% else %}
        <i class="fa-solid fa-triangle-exclamation"></i>
      {% endif %}
    </div>
    <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--slate-800); margin-bottom: 0.5rem;">{{ title }}</h2>
    <p style="color: var(--slate-600); font-size: 0.95rem; margin-bottom: 1.75rem; line-height: 1.5;">
      {{ message }}
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="{{ url_for('public.index') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return Home</a>
      <button type="button" onclick="window.history.back()" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
    </div>
  </div>
</div>
{% endblock %}
