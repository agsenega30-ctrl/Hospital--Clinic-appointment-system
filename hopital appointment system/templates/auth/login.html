{% extends "base.html" %}

{% block title %}Log In - {{ app_name }}{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
  <div class="card" style="max-width: 440px; width: 100%; box-shadow: var(--shadow-xl); border: 1px solid var(--slate-200); border-radius: var(--radius-xl);">
    <div style="padding: 2.5rem 2rem 1.5rem; text-align: center;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--slate-900);">Welcome Back</h2>
      <p style="color: var(--slate-500); font-size: 0.88rem; margin-top: 0.25rem;">
        Log in to access your appointments and medical schedule
      </p>
    </div>

    <div style="padding: 0 2rem 2rem;">
      <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" style="margin-bottom: 0;"><i class="fa-solid fa-lock"></i> Password</label>
          </div>
          <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <!-- Quick Demo Fill Buttons (Ideal for Evaluation / Presentation) -->
      <div style="margin-top: 2rem; border-top: 1px solid var(--slate-100); padding-top: 1.25rem;">
        <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--slate-400); display: block; margin-bottom: 0.65rem;">
          Quick Demo Credentials:
        </span>
        <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('patient@hospital.com', 'Patient@123456')">
            <i class="fa-solid fa-user"></i> Patient
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('sarah.jenkins@hospital.com', 'Doctor@123456')">
            <i class="fa-solid fa-user-doctor"></i> Doctor
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('admin@hospital.com', 'Admin@Hospital2026')">
            <i class="fa-solid fa-shield-halved"></i> Admin
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--slate-600);">
        Don't have a patient account?
        <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register Here</a>
      </div>
    </div>
  </div>
</div>

<script>
function fillDemo(email, pwd) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = pwd;
}
</script>
{% endblock %}
